[workspace]
resolver = "2"
members = [
    "crates/scriptorium-core",
    "crates/scriptorium-cli",
    "crates/scriptorium-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "GPL-3.0-only"
repository = "https://github.com/xpolb01/scriptorium"
authors = ["Bogdan Polovko"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "process"] }
async-trait = "0.1.92"

# Serde + formats
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Held at 0.0.12: 0.0.13 is a deprecated shim over `noyalib` that renders
# frontmatter differently (quoting, indentation, no trailing newline) and
# keys `Mapping` by `String`, which would change every page's `content_hash`.
serde_yml = "0.0.12"
toml = "1.1.6"

# Frontmatter
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }

# Markdown + links
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"

# Filesystem + walking
ignore = "0.4.33"
camino = { version = "1.2.6", features = ["serde1"] }
directories = "6.0.0"
fd-lock = "4.0.4"

# Hashing + IDs
sha2 = "0.11.0"
base64 = "0.23.1"
ulid = { version = "3.0.0", features = ["serde"] }
rand = "0.10.3"
hostname = "0.4.2"

# JSON Schema
schemars = "1.2.2"
jsonschema = { version = "0.57.0", default-features = false }

# Storage
# `fallible_uint` keeps the checked u64/usize <-> INTEGER conversions that
# rusqlite provided unconditionally before 0.38.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }

# Git
git2 = { version = "0.21.0", default-features = false }

# Watching
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# HTTP
# `rustls` is 0.12's `rustls-tls` renamed; it now uses the aws-lc-rs provider
# and the OS trust store (rustls-platform-verifier) instead of webpki-roots.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }

# Web framework (optional, for dashboard feature)
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }

# Logging + errors
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
miette = { version = "7.6.0", features = ["fancy"] }

# Retry
backoff = { version = "0.4.0", features = ["tokio"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"

# Internal crates
scriptorium-core = { path = "crates/scriptorium-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
